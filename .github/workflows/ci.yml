name: MT Panel CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q agent panel
      - run: node --check web/app.js
      - run: bash -n scripts/dev.sh scripts/install-vps.sh scripts/vps-preflight.sh scripts/test.sh scripts/upgrade-vps.sh scripts/vps-test-sync.sh scripts/tailscale-access.sh
      - run: python -m pytest tests/test_vps_installer.py -q
      - run: python -m py_compile scripts/promote-vps.py scripts/vps-status.py scripts/verify-live-vps.py scripts/release-status.py scripts/install-next-preview-stage.py
      - run: python -m pytest tests/test_verify_live_vps.py tests/test_release_status.py -q
      - run: python -m compileall -q agent panel
      - run: python -m pytest tests/test_enrollment.py -q
      - run: python -m pytest tests/test_agent_heartbeat.py tests/test_host_reports.py tests/test_fleet.py tests/test_operational_pages.py tests/test_diagnostics.py tests/test_local_execution.py tests/test_lab_jobs.py tests/test_recovery.py tests/test_review_evidence.py tests/test_next_preview.py tests/test_next_preview_bundle.py -q

  next-static-preview:
    name: Next.js static preview build (no backend deployment)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-next
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Preview-only phase: lockfile generation and pinning is a release gate.
      # npm never runs on the installed MT Panel VPS.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - name: Create revision-bound static bundle manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path("out")
          files = {}
          for path in sorted(output.rglob("*")):
              if path.is_symlink():
                  raise SystemExit("symlinks not allowed in static export")
              if path.is_file():
                  rel = path.relative_to(output).as_posix()
                  files[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          if "index.html" not in files or "monitoring/index.html" not in files:
              raise SystemExit("incomplete Next export")
          (output / "mt-panel-build-manifest.json").write_text(
              json.dumps({"format": 1, "commit": os.environ["GITHUB_SHA"],
                          "files": files}, sort_keys=True, separators=(",", ":")) + "\\n"
          )
          PY
      - name: Verify exported static routes and no new server runtime
        run: |
          test -f out/index.html
          test -f out/monitoring/index.html
          test -f out/deployments/index.html
          test -f out/settings/index.html
          test ! -d src/app/api
          test ! -f src/proxy.ts
          test ! -f src/middleware.ts
      - name: Upload exact-commit static preview (no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: mt-panel-next-static
          path: frontend-next/out/
          retention-days: 14
          if-no-files-found: error

  ephemeral-docker-lab:
    name: Disposable Docker Engine lab (non-production)
    # Only run on GitHub-hosted ephemeral runners, never on a self-hosted
    # runner or on the user's production VPS. No deployment credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 18
    env:
      MT_PANEL_EPHEMERAL_DOCKER_TEST: YES_DISPOSABLE_GITHUB_HOSTED_RUNNER_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Prove runner is disposable, not production
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test ! -e /etc/mt-panel/mt-panel.env
          docker info >/dev/null
      - name: Test signed lab Docker create / health / stop and exact ownership
        run: python -m pytest tests/integration/test_real_docker_lab.py -q -s
