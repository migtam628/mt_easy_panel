name: MT Panel CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q agent panel
      - run: node --check web/app.js
      - run: bash -n scripts/dev.sh scripts/install-vps.sh scripts/vps-preflight.sh scripts/test.sh scripts/upgrade-vps.sh scripts/tailscale-access.sh
      - run: python -m pytest tests/test_vps_installer.py -q
      - run: python -m py_compile scripts/promote-vps.py scripts/vps-status.py
      - run: python -m compileall -q agent panel
      - run: python -m pytest tests/test_enrollment.py -q
